<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CCS Sit-in Monitoring System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <span class="nav-brand">College of Computer Studies Sit-in Monitoring System</span>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#" class="dropdown-toggle">Community</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>

  <!-- MAIN CONTENT -->
  <main>
    <div class="card">

      <!-- LOGO -->
      <div class="logo-section">
        <img src="images/ccs-logo.png" alt="CCS Logo" class="logo-img" />
      </div>

      <!-- LOGIN FORM -->
      <div class="form-section">

        <div class="form-group">
          <input type="text" id="idNumber" placeholder="Enter a valid id number" />
          <label for="idNumber">ID Number</label>
        </div>

        <div class="form-group">
          <input type="password" id="password" placeholder="Enter password" />
          <label for="password">Password</label>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember" /> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button class="btn-login" id="loginBtn">Login</button>

        <p class="register-text">
          Don't have an account? <a href="#">Register</a>
        </p>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
